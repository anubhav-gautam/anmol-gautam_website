<section class="page-hero"><p class="eyebrow"><span></span><span data-en="GET IN TOUCH" data-hi="संपर्क करें">GET IN TOUCH</span></p><h1 data-en="Contact" data-hi="संपर्क">Contact</h1><p data-en="Reach out for partnerships, admissions or seva enquiries." data-hi="साझेदारी, प्रवेश या सेवा संबंधी पूछताछ के लिए संपर्क करें।">Reach out for partnerships, admissions or seva enquiries.</p></section>
<section class="contact-section"><div><p class="eyebrow" style="color:#987123" data-en="REACH OUT" data-hi="संपर्क करें">REACH OUT</p><h2 style="font-size:clamp(30px,3.6vw,44px);color:var(--navy);margin-bottom:26px" data-en="Let’s start a <em>conversation.</em>" data-hi="आइए <em>बात करें।</em>">Let’s start a <em>conversation.</em></h2><div class="contact-cards" id="contactCards"></div></div>
<form class="contact-form" id="contactForm"><label><span data-en="NAME" data-hi="नाम">NAME</span><input name="name" required autocomplete="name"></label><label><span data-en="MESSAGE" data-hi="संदेश">MESSAGE</span><textarea name="message" rows="6" required></textarea></label><button class="button button-gold" type="submit" data-en="SEND MESSAGE" data-hi="संदेश भेजें">SEND MESSAGE</button><p class="form-note" id="formNote"></p></form></section>

<section class="royal-quote"><div class="rq-orn">❖</div><p class="rq-sa">वसुधैव कुटुम्बकम्</p><p class="rq-text" data-en="“The world is one family.”" data-hi="“सारा संसार एक परिवार है।”">“The world is one family.”</p><p class="rq-src" data-en="— Maha Upanishad, ancient Sanskrit text" data-hi="— महोपनिषद्, प्राचीन संस्कृत ग्रंथ">— Maha Upanishad, ancient Sanskrit text</p></section>
